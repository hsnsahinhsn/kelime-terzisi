# Şişirilmiş sözler ve dolaylı eylem kalıpları.

[[kural]]
kimlik = "S001"
ad = "Yadsınamaz kesinliği"
grup = "sozcuk"
sinif = "yz"
duzey = "zayif"
agirlik = 1
desen = ['\byadsınamaz{EK}\b', '\binkar\s+edilemez{EK}\b']
en_az = 2
aciklama = "Tekrarlanan kesinlik vurgusu iddianın dayanağını okura bırakıyor."
oneri = "Vurgu yerine metinde verilen kanıtı yaz ve iddianın kesinlik derecesini koru."
kaynak = "turkish-anti-ai-skill references/ai-turkcesi-sozlugu.md:13 (Yüce Zerey, MIT)"
yakalamali = ["Bu fark yadsınamazdır. Sağladığı yarar da yadsınamaz.", "Artışın etkisi inkâr edilemez. Değişimin önemi yadsınamaz."]
yakalamamali = ["Tanığın katkısı yadsınamaz.", "Bu iddiayı yadsıdığını mahkemede söyledi. Veriler eksik."]

[[kural]]
kimlik = "S002"
ad = "Âdeta tekrarı"
grup = "sozcuk"
sinif = "yz"
duzey = "zayif"
agirlik = 1
desen = ['\badeta\b']
en_az = 2
haric_turler = ["anlati"]
aciklama = "Yinelenen âdeta benzetmeleri anlatımı tekdüzeleştiriyor."
oneri = "Benzetmelerden anlam taşıyanı bırak ve diğer cümlede gözlemi doğrudan anlat."
kaynak = "turkce-humanizer SKILL.md:251 (bushrabeg, MIT)"
yakalamali = ["Arayüz âdeta bir pusula. Gösterge de âdeta bir fener.", "Bu paket adeta bir köprü. Yeni plan adeta bir kalkan."]
yakalamamali = ["Soğuktan âdeta donduk.", "Daha önce âdet gören uygulamayı değiştirdik."]

[[kural]]
