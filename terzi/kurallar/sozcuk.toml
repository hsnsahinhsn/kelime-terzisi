yakalamamali = ["O karar hayatımda bir dönüm noktasıydı.", "Tam dönüm noktasında yolun yerini işaretledik."]

[[kural]]
kimlik = "S007"
ad = "Kilometre taşı"
grup = "sozcuk"
sinif = "yz"
duzey = "zayif"
agirlik = 1
desen = ['\bkilometre\s+taş(?:ı|ları)(?:n(?:ı|a|ın|da|dan)|yla|(?:ydı|ymış|ysa|dır){EK})?\b']
en_az = 2
haric = ['\b(?:yol|otoyol|karayol)(?:da|unda|un\s+kenarında|un\s+üzerinde)\b', '\bkilometre\s+taşı{EK}\s+(?:dik|sök|devril|boya){EK}\b']
aciklama = "Kilometre taşı benzetmesi her aşamaya uygulandığında aşamalar arasındaki farkı örtüyor."
oneri = "Benzetme yerine hangi aşamanın tamamlandığını veya hangi hedefe ulaşıldığını yaz."
kaynak = "turkish-anti-ai-skill references/ai-turkcesi-sozlugu.md:23 (Yüce Zerey, MIT)"
yakalamali = ["Yeni sayfa bir kilometre taşı. Bülten de önemli bir kilometre taşıdır.", "İlk sürümü kilometre taşı sayıyoruz. İkinci kilometre taşına bugün ulaştık.", "Rapor kilometre taşlarını sıralıyor. Toplantıda yeni kilometre taşları belirlendi."]
yakalamamali = ["Yolun kenarında ilk kilometre taşı vardı. İkinci kilometre taşı devrilmişti.", "İlk teslimatı kilometre taşı saydık.", "Kamyon yükü yüz kilometre taşıdı. Traktör de on kilometre taşıdı."]

