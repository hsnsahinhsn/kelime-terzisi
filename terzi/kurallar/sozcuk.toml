oneri = "İncelenen yönleri belirt veya sadece inceleme fiilini kullan."
kaynak = "turkish-anti-ai-skill references/ai-turkcesi-sozlugu.md:15 (Yüce Zerey, MIT)"
yakalamali = ["Konuyu derinlemesine inceleyeceğiz. Veriyi de derinlemesine analiz edeceğiz.", "Ayrıntılara derinlemesine dalacağız. Bulguları derinlemesine değerlendireceğiz."]
yakalamamali = ["Sonuçları derinlemesine inceledi.", "Taşı derinlemesine oymak için ince uç kullandı."]

[[kural]]
