kaynak = "turkish-anti-ai-skill references/ai-turkcesi-sozlugu.md:16 (Yüce Zerey, MIT)"
yakalamali = ["Geniş bir yelpazede servis veriyoruz. Mağaza da geniş bir yelpaze sunuyor.", "Geniş bir yelpazeyi kapsıyoruz. Eğitimler de geniş bir yelpazeye yayılıyor."]
yakalamamali = ["Sınıfta geniş bir yelpazeyle yellendi. Kardeşi geniş bir yelpazeyi salladı.", "Arşiv geniş bir yelpazede belge barındırıyor."]

[[kural]]
