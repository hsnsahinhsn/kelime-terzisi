# Asistan artıkları ve yazışma kalıpları.

[[kural]]
kimlik = "I001"
ad = "Umarım yardımcı olur"
grup = "iletisim"
sinif = "yz"
duzey = "orta"
agirlik = 2
desen = ['\bumarım,?\s+(?:(?:bu|bu\s+yanıt|bu\s+düzenleme|bu\s+özet)\s+)?(?:(?:yardımcı|faydalı)\s+ol(?:ur|muştur)|işinize\s+yarar)\b']
yer = "cumle_basi"
haric_turler = ["anlati", "eposta"]
aciklama = "Hazır fayda dileği metnin sonuna sohbet havası katıyor."
oneri = "Dileği çıkar ve metni son bilgi veya gerekli eylemle bitir."
kaynak = "insanca references/kaliplar/iletisim-dolgu-kurgu.md:10–15 (Tahir Yıldız, MIT); turkish-anti-ai-skill references/ai-turkcesi-sozlugu.md:70 (Yüce Zerey, MIT)"
yakalamali = ["Umarım yardımcı olur!", "Umarım bu düzenleme işinize yarar."]
yakalamamali = ["Umarım Ayşe de yarın bize yardımcı olur.", "Kılavuz kurulum sırasında yardımcı olur."]

