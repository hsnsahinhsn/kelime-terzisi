    '\bhiç\s+bir\b(?!\s+(?:araya|(?:arada|başına)(?:yken)?|kez|defa|an\s+olsun|türlü)\b)(?=(?:\s+{S}){1,2}\s+(?:değil{EK}|yok(?:tu{EK}|tur{EK}|muş{EK}|sa{EK})?|{S}(?:madı|medi|mamış|memiş|maz|mez|m[ıiuü]yor){EK})\b(?:\s*(?:[.!?,;:]|$)|\s+m[ıiuü]\b))',
]
