    "Hiç birikim yapamadım.",
    "Hiç bir balinayı yakından gördün mü?",
    "Hiç bir balinayı küçükken açık denizde kendi gözlerinle gördün mü?",
    "İki kardeş hiç bir arada yaşamadı.",
