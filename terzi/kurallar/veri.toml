kaynak = "Kelime Terzisi derlemi: 99 insan, 83 YZ metni, log-odds (olcum.kural_aday), 18.11.2026"
yakalamali = ["Bakanlık, konuya ilişkin açıklamasında çalışmaların sürdürüleceğini vurguladı. Yetkililer, bölgedeki koşulların ardından yeni önlemler alınacağını ifade etti. Toplantının ardından yapılan açıklamada, iş birliği çerçevesinde ortak adımlar atılacağı belirtildi. Uzmanlar, bu adımların bölge açısından büyük önem taşıdığını dile getirdi. Yetkililer ayrıca önümüzdeki günlerde çok sayıda kurumla temaslarda bulunulacağını söyledi. Açıklamada, sürecin yalnızca ekonomik değil, siyasi açıdan da önemli olduğu kaydedildi."]
yakalamamali = ["Bakan dün akşam gazetecilere konuştu. Bölgedeki çiftçilerin zararının karşılanacağını, ödemelerin ay sonunda başlayacağını söyledi. Sorulara da yanıt verdi: Kaç çiftçinin başvurduğu henüz belli değil, ama sayı binleri bulabilir. Toplantıdan sonra köylülerle görüşen bakan, ertesi sabah Ankara'ya döndü. Muhalefet ise açıklamayı yetersiz buldu. Bir milletvekili, ödemelerin geç kaldığını ve birçok ailenin borçlandığını hatırlattı."]
