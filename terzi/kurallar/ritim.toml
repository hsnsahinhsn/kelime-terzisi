islev = "acilis_tekrar"
esik = { pay = 0.25, en_az_cumle = 6, liste = ["ayrıca", "bunun yanı sıra", "bununla birlikte", "öte yandan", "bunun yanında", "dahası", "üstelik", "sonuç olarak", "bu nedenle", "bu bağlamda", "bu doğrultuda", "bu çerçevede", "ek olarak", "son olarak", "özetle", "kısacası", "nitekim", "dolayısıyla", "aynı zamanda"] }
aciklama = "Cümlelerin dörtte birinden çoğu geçiş bağlacıyla açılıyor."
oneri = "Bağlaçların çoğunu sil; ilişki zaten anlaşılıyorsa cümleyi doğrudan konuyla başlat."
kaynak = "I dil.md 19, olcum.py açılış listesi; T ai-turkcesi-sozlugu.md katman 2"
yakalamali = ["Proje geçen yıl başladı. Ayrıca bütçe artırıldı. Bunun yanı sıra yeni personel alındı. Öte yandan bazı sorunlar çıktı. Bununla birlikte ekip hedefe ulaştı. Sonuç olarak proje başarılı oldu."]
yakalamamali = ["Proje geçen yıl başladı. Bütçe artırıldı, yeni personel alındı. Bazı sorunlar çıktı ama ekip hedefe ulaştı. Ayrıca bir ödül de kazandı. Yönetim memnun. Gelecek yıl ikinci aşama başlayacak."]

