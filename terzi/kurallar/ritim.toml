yakalamamali = ["Festival bu yıl da büyük ilgi gördü. Sanatçılar sahneye çıktı, izleyiciler coştu. Belediye ücretsiz ulaşım sağladı. Esnaf da indirim yaptı. Gece havai fişeklerle sona erdi."]

