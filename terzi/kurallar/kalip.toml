# Cümle kuruluşu ve metin kalıpları.

[[kural]]
kimlik = "K001"
ad = "Olumsuz karşıtlık kalıbı"
grup = "kalip"
sinif = "yz"
duzey = "orta"
agirlik = 2
desen = ['\b(?:asıl\s+)?(?:mesele|sorun)\s+(?:{S}\s+){1,6}değil{EK}\s*[,;]\s*(?:bir\s+)?{S}', '\bbu\s+(?:(?:yalnızca|sadece)\s+)?bir\s+(?:{S}\s+){1,5}değil{EK}\s*[,;]\s*(?:{S}\s+)?bir\s+{S}']
en_az = 2
haric_turler = ["anlati"]
haric = ['\b(?:değil|değildi|değildir)\s*[,;]\s*(?:mi|mı|mu|mü)\b']
aciklama = "Olumsuz karşıtlığın tekrarı, kendi başına söylenebilecek bir yargıyı sürekli bir reddin arkasına koyuyor."
oneri = "Gerçek bir yanlış anlamayı düzeltiyorsan karşıtlığı koru, öbür cümlelerde asıl yargıyı doğrudan yaz."
kaynak = "insanca references/kaliplar/dil.md:21–25 (Tahir Yıldız, MIT)"
yakalamali = ["Mesele hız değil, güven. Bu bir araç değil, bir vizyondur.", "Bu bir işlem değil, bir deneyim. Asıl mesele büyümek değil, kalıcı olmak.", "Bu yalnızca bir araç değildi, bir dönüşümün başlangıcıydı. Bu sadece bir güncelleme değildi, bir dönemin sonuydu.", "Bu sadece bir güncelleme değil, yeni bir başlangıçtır. Bu yalnızca bir ekleme değil, farklı bir yaklaşımdır."]
yakalamamali = ["Mesele fiyat değil, süre.", "Bu ahşap değil mi, diye sordu. Ağaç türünü henüz bilmiyoruz."]

[[kural]]
kimlik = "K002"
ad = "Sadece değil, aynı zamanda"
grup = "kalip"
sinif = "yz"
duzey = "orta"
agirlik = 2
desen = ['\b(?:sadece|yalnızca|salt)\s+(?:{S}\s+){1,10}değil{EK}\s*[,;]?\s+aynı\s+zamanda\b']
aciklama = "Ek bilgi, olumsuzluk ve aynı zamanda kalıbıyla uzun bir yoldan veriliyor."
oneri = "İki öğeyi hem yapısıyla birleştir veya ikinci öğeyi de ile ekle."
kaynak = "turkce-humanizer SKILL.md:213–233 (bushrabeg, MIT)"
yakalamali = ["Bu sadece bir ekran değil, aynı zamanda bir kontrol paneli.", "İş yalnızca zaman kazandırmak değil aynı zamanda hataları azaltmaktır."]
yakalamamali = ["Hem ekranı hem klavyeyi gönderin.", "Bu yalnızca bir kontrol paneli ve aynı zamanda satın alınabiliyor."]

[[kural]]
kimlik = "K003"
ad = "Yapmakla kalmayıp"
grup = "kalip"
sinif = "yz"
duzey = "zayif"
agirlik = 1
desen = ['\b{S}(?:makla|mekle)\s+kalm(?:ayıp|adan|ıyor{EK}|az{EK}|adı{EK})\b']
en_az = 2
haric_turler = ["anlati"]
aciklama = "Yapmakla kalmamak yapısı tekrarlandığında eklemeli cümleler aynı biçime giriyor."
oneri = "Eklenen eylemi de ile bağla veya iki eylemi ayrı cümlelerde ver."
kaynak = "turkish-anti-ai-skill references/ai-turkcesi-sozlugu.md:20 (Yüce Zerey, MIT)"
yakalamali = ["Araç veri toplamakla kalmayıp rapor da hazırlıyor. Ekip de raporu incelemekle kalmıyor, sahaya çıkıyor.", "Plan verimi artırmakla kalmaz, maliyeti de düşürür. Düzenleme maliyeti düşürmekle kalmadı, süreci de kısalttı."]
yakalamamali = ["Bize kızmakla kalmadı, masayı da devirdi.", "Daha çok okumakla doğru kaynak kullanmak aynı şey değil."]

[[kural]]
