ad = "Adsız uzman atfı"
grup = "kalip"
sinif = "yz"
duzey = "orta"
agirlik = 2
desen = ['\b(?:uzmanlara|pek\s+çok\s+gözlemciye)\s+göre\b', '\buzmanlar,?\s+(?:belirt|söyle|söylüyor|vurgula|vurguluyor){EK}\s+ki\b']
yer = "cumle_basi"
