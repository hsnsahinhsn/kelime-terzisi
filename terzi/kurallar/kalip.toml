yakalamali = ["Uzmanlara göre bu plan gereksiz.", "Pek çok gözlemciye göre bu artış sürecektir.", "Uzmanlar söylüyor ki giderler artacak.", "Uzmanlar vurguluyor ki süre uzayacak."]
yakalamamali = ["Raporun yazarı Sema Işık'a göre bu artış sürecek.", "Uzmanlara göre bu artış sürecek (Işık, 2023).", "Ayşe ile Mehmet adlı uzmanlara göre bu rakam eksik."]

